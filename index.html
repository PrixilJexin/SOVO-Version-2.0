<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preload" href="./astronauta.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
  <title>Society Of Visual Originators</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #05070d;
    }

    canvas {
      display: block;
    }

    #cinematicBlack {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      opacity: 0;
      pointer-events: none;
    }

    #startupLoader {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      background: #000;
      color: #eef7ff;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #startupLoader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .startup-loader__text {
      position: relative;
      font: 500 clamp(16px, 2vw, 24px)/1 'Tipo Metro CDMX', sans-serif;
      letter-spacing: 4px;
      text-indent: 4px;
      text-transform: uppercase;
      overflow: hidden;
      background: linear-gradient(90deg, #000, #fff, #000);
      background-repeat: no-repeat;
      background-size: 80%;
      animation: loading-scan 3s linear infinite;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: rgba(255, 255, 255, 0);
      color: transparent;
    }

    @keyframes loading-scan {
      0% {
        background-position: -500%;
      }

      100% {
        background-position: 500%;
      }
    }

    #enterPrompt {
      position: absolute;
      bottom: 18vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #enterPrompt.is-ready {
      opacity: 1;
      pointer-events: auto;
    }

    .enter-prompt__label {
      font-family: 'Tipo Metro CDMX', sans-serif;
      font-weight: 300;
      font-size: clamp(10px, 1.1vw, 13px);
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      color: rgba(238, 247, 255, 0.5);
      animation: enter-breathe 2.4s ease-in-out infinite;
    }

    .enter-prompt__line {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, rgba(238,247,255,0.0), rgba(238,247,255,0.45), rgba(238,247,255,0.0));
      animation: enter-breathe 2.4s ease-in-out infinite;
    }

    @keyframes enter-breathe {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* ------------------------------------------------------------------- */
    /*  BRAND TYPEFACE                                                       */
    /*  Drop TipoMetroCDMX-Regular.otf and TipoMetroCDMX-Light.otf in the    */
    /*  same folder as this file for these to resolve.                      */
    /* ------------------------------------------------------------------- */
    @font-face {
      font-family: 'Tipo Metro CDMX';
      src: url('./TipoMetroCDMX-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Tipo Metro CDMX';
      src: url('./TipoMetroCDMX-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    /* ------------------------------------------------------------------- */
    /*  SHUTTER FLASH — a single-frame photographic "click" used to punctuate*/
    /*  the cut from Frame 1 into the Frame 2 cinematic push-in.             */
    /* ------------------------------------------------------------------- */
    #shutterFlash {
      position: fixed;
      inset: 0;
      z-index: 250;
      background: #fdfbff;
      opacity: 0;
      pointer-events: none;
    }

    #shutterFlash.is-flashing {
      animation: shutter-click 0.26s ease-out;
    }

    @keyframes shutter-click {
      0% {
        opacity: 0;
      }

      10% {
        opacity: 0.85;
      }

      100% {
        opacity: 0;
      }
    }

    /* ------------------------------------------------------------------- */
    /*  FRAME ONE HUD — a quiet viewfinder layer that only lives over the    */
    /*  astronaut's held first frame: corner registration marks, a running   */
    /*  timecode, and the typed headline.                                    */
    /* ------------------------------------------------------------------- */
    #frameOneOverlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    #frameOneOverlay.is-visible {
      opacity: 1;
    }

    #frameOneOverlay.is-leaving {
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .hud-corner {
      position: absolute;
      width: clamp(18px, 2.6vw, 34px);
      height: clamp(18px, 2.6vw, 34px);
      border: 1px solid rgba(238, 247, 255, 0.34);
      opacity: 0;
      transition: opacity 1.1s ease 0.15s;
    }

    #frameOneOverlay.is-visible .hud-corner {
      opacity: 0.34;
      animation: hud-breathe 7s ease-in-out infinite;
    }

    .hud-corner--tl {
      top: 4.2vh;
      left: 3.2vw;
      border-right: none;
      border-bottom: none;
      animation-delay: 0s;
    }

    .hud-corner--tr {
      top: 4.2vh;
      right: 3.2vw;
      border-left: none;
      border-bottom: none;
      animation-delay: 1.7s;
    }

    .hud-corner--bl {
      bottom: 4.2vh;
      left: 3.2vw;
      border-right: none;
      border-top: none;
      animation-delay: 3.4s;
    }

    .hud-corner--br {
      bottom: 4.2vh;
      right: 3.2vw;
      border-left: none;
      border-top: none;
      animation-delay: 5.1s;
    }

    @keyframes hud-breathe {

      0%,
      100% {
        opacity: 0.24;
      }

      50% {
        opacity: 0.5;
      }
    }

    .hud-timecode {
      position: absolute;
      top: 4.7vh;
      right: calc(3.2vw + 46px);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(10px, 0.95vw, 13px);
      letter-spacing: 0.09em;
      color: rgba(238, 247, 255, 0.42);
      opacity: 0;
      transition: opacity 1.1s ease 0.35s;
    }

    #frameOneOverlay.is-visible .hud-timecode {
      opacity: 1;
    }

    .frame-one-headline {
      position: absolute;
      left: 7vw;
      right: 7vw;
      bottom: 24vh;
      max-width: 880px;
      font-family: 'Tipo Metro CDMX', sans-serif;
      font-weight: 300;
      font-size: clamp(21px, 3.2vw, 44px);
      line-height: 1.28;
      letter-spacing: 0.01em;
      color: #f4f1fb;
      text-shadow: 0 0 30px rgba(255, 143, 203, 0.26), 0 0 2px rgba(255, 255, 255, 0.18);
      text-align: left;
    }

    .headline-need {
      display: inline-block;
      color: #ffffff;
      background: linear-gradient(120deg,
          rgba(255, 143, 203, 0.0) 0%,
          rgba(255, 220, 240, 0.95) 40%,
          rgba(255, 255, 255, 1.0) 50%,
          rgba(255, 220, 240, 0.95) 60%,
          rgba(255, 143, 203, 0.0) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 250% auto;
      animation: need-shimmer 3s ease-in-out infinite, need-glow-pulse 3s ease-in-out infinite;
      text-shadow: none;
      filter: drop-shadow(0 0 8px rgba(255, 143, 203, 0.7)) drop-shadow(0 0 20px rgba(255, 180, 220, 0.4));
    }

    @keyframes need-shimmer {
      0% {
        background-position: 100% center;
      }

      50% {
        background-position: 0% center;
      }

      100% {
        background-position: 100% center;
      }
    }

    @keyframes need-glow-pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 6px rgba(255, 143, 203, 0.6)) drop-shadow(0 0 18px rgba(255, 180, 220, 0.35));
      }

      50% {
        filter: drop-shadow(0 0 14px rgba(255, 143, 203, 0.95)) drop-shadow(0 0 36px rgba(255, 200, 235, 0.6));
      }
    }

    .frame-one-cursor {
      display: inline-block;
      margin-left: 2px;
      font-weight: 300;
      color: rgba(255, 143, 203, 0.88);
      animation: cursor-blink 0.9s step-end infinite;
    }

    #frameOneOverlay.is-leaving .frame-one-cursor {
      opacity: 0;
    }

    @keyframes cursor-blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .frame-one-headline {
        top: 12vh;
        bottom: auto;
        left: 6vw;
        right: 6vw;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .hud-corner,
      .frame-one-cursor {
        animation: none !important;
      }

      #frameOneOverlay,
      #shutterFlash.is-flashing {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div id="cinematicBlack"></div>
  <div id="shutterFlash" aria-hidden="true"></div>
  <div id="frameOneOverlay" aria-hidden="true">
    <div class="hud-corner hud-corner--tl"></div>
    <div class="hud-corner hud-corner--tr"></div>
    <div class="hud-corner hud-corner--bl"></div>
    <div class="hud-corner hud-corner--br"></div>
    <div class="hud-timecode" id="hudTimecode">00:00:00:00</div>
    <div class="frame-one-headline"><span id="frameOneTypewriterText"></span><span class="frame-one-cursor"
        id="frameOneCursor">|</span></div>
  </div>
  <div id="startupLoader">
    <div class="startup-loader__text" data-label="LOADING">SOCIETY OF VISUAL ORIGINATORS</div>
    <div id="enterPrompt" role="button" aria-label="Enter experience" tabindex="0">
      <div class="enter-prompt__line"></div>
      <div class="enter-prompt__label">Enter</div>
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import GUI from 'lil-gui';

    /* --------------------------------------------------------------------- */
    /*  BASIC SETUP                                                           */
    /* --------------------------------------------------------------------- */

    const container = document.body;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.environmentIntensity = 1;

    const isMobile = () => window.innerWidth <= 768;

    const frameOneTarget = new THREE.Vector3(-5.44, 3.46, 0.09);
    const desktopFrameOnePos = new THREE.Vector3(1.50, 3.67, 0.14);
    // Moving the camera back by 40% along the viewing axis away from the target for mobile view:
    const mobileFrameOnePos = new THREE.Vector3()
      .subVectors(desktopFrameOnePos, frameOneTarget)
      .multiplyScalar(1.4)
      .add(frameOneTarget);

    function getFrameOnePosition() {
      return isMobile() ? mobileFrameOnePos : desktopFrameOnePos;
    }

    const introDescent = {
      active: false,
      elapsed: 0,
      duration: 2.2,
      offsetY: 3.5,
      startPosition: new THREE.Vector3(),
      endPosition: new THREE.Vector3(),
    };

    function getAboveFrameOnePosition() {
      const pos = getFrameOnePosition();
      return new THREE.Vector3(pos.x, pos.y + introDescent.offsetY, pos.z);
    }

    const camera = new THREE.PerspectiveCamera(
      22, window.innerWidth / window.innerHeight, 0.05, 500
    );
    camera.position.copy(getAboveFrameOnePosition());

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 3.0;
    container.appendChild(renderer.domElement);

    function createStarField(count, radius, size, opacity, brightness = 1) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();
      for (let index = 0; index < count; index += 1) {
        const direction = new THREE.Vector3(
          THREE.MathUtils.randFloatSpread(2),
          THREE.MathUtils.randFloatSpread(2),
          THREE.MathUtils.randFloatSpread(2)
        ).normalize();
        const distance = radius + THREE.MathUtils.randFloatSpread(radius * 0.12);
        positions[index * 3] = direction.x * distance;
        positions[index * 3 + 1] = direction.y * distance;
        positions[index * 3 + 2] = direction.z * distance;
        const isWarm = Math.random() < 0.16;
        color.setHSL(
          isWarm ? THREE.MathUtils.randFloat(0.07, 0.14) : THREE.MathUtils.randFloat(0.54, 0.66),
          THREE.MathUtils.randFloat(0.12, 0.34),
          THREE.MathUtils.randFloat(0.72, 1.0)
        ).multiplyScalar(brightness);
        colors[index * 3] = color.r;
        colors[index * 3 + 1] = color.g;
        colors[index * 3 + 2] = color.b;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      const material = new THREE.PointsMaterial({
        size,
        vertexColors: true,
        transparent: true,
        opacity,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
      });
      const stars = new THREE.Points(geometry, material);
      stars.frustumCulled = false;
      return stars;
    }

    const starField = new THREE.Group();
    starField.add(createStarField(7000, 90, 0.035, 0.68, 1.0));
    starField.add(createStarField(900, 88, 0.075, 0.82, 1.8));
    starField.add(createStarField(80, 86, 0.14, 0.6, 3.5));
    scene.add(starField);
    const starMaterials = starField.children.map((stars) => ({
      material: stars.material,
      opacity: stars.material.opacity,
      size: stars.material.size,
    }));

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const hdriLoader = new THREE.TextureLoader();
    hdriLoader.load(
      './sovohdri.png',
      (hdriTexture) => {
        hdriTexture.colorSpace = THREE.SRGBColorSpace;
        hdriTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        hdriTexture.minFilter = THREE.LinearMipmapLinearFilter;
        hdriTexture.magFilter = THREE.LinearFilter;
        hdriTexture.mapping = THREE.EquirectangularReflectionMapping;
        const environmentMap = pmremGenerator.fromEquirectangular(hdriTexture).texture;
        scene.environment = environmentMap;
        scene.environmentIntensity = environmentBaseIntensity;
        hdriTexture.dispose();
        pmremGenerator.dispose();
        modelEntries.forEach((entry) => {
          if (!entry.root) return;
          entry.root.traverse((child) => {
            if (!child.isMesh) return;
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((material) => {
              if (material && 'envMapIntensity' in material) material.envMapIntensity = 1.35;
            });
          });
        });
      },
      undefined,
      (error) => console.error('Unable to load sovohdri.png for reflections.', error)
    );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(frameOneTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.3;
    controls.maxDistance = 60;
    controls.update();

    // GUI is created up front so any model, once it finishes loading asynchronously,
    // can add its own folder to it regardless of load order/timing.
    const gui = new GUI({ title: 'Debug Controls' });
    gui.domElement.style.maxHeight = '96vh';
    gui.domElement.style.overflowY = 'auto';
    gui.domElement.style.display = 'none';

    /* --------------------------------------------------------------------- */
    /*  ENVIRONMENT / GROUND / HELPERS                                        */
    /* --------------------------------------------------------------------- */

    const groundGeo = new THREE.CircleGeometry(20, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111520, roughness: 1, metalness: 0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    ground.visible = false;
    scene.add(ground);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x88aaff, 0x11141c, 1.31);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0x7a7a7a, 2.4);
    keyLight.position.set(-4.2, 8.3, -4.2);
    keyLight.target.position.set(20, 1, -20);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(4096, 4096);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.bias = -0.00005;
    keyLight.shadow.normalBias = 0.015;
    scene.add(keyLight, keyLight.target);

    /* --------------------------------------------------------------------- */
    /*  ADJUSTABLE SPOTLIGHT                                                  */
    /* --------------------------------------------------------------------- */

    const spotLight = new THREE.SpotLight(0xff8fcb, 226.9, 10, THREE.MathUtils.degToRad(14), 0.3, 2.15);
    spotLight.position.set(1, 12.1, 6.9);
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.set(4096, 4096);
    spotLight.shadow.camera.near = 0.1;
    spotLight.shadow.camera.far = 18;
    spotLight.shadow.bias = -0.00005;
    spotLight.shadow.normalBias = 0.012;
    scene.add(spotLight);
    scene.add(spotLight.target);
    spotLight.target.position.set(-2.3, 1, -0.7);
    keyLight.target.position.z = 20;
    spotLight.position.z = -20;

    const lightSweepSettings = {
      enabled: true,
      speed: 0.4,
      phase: 0,
      range: 20,
      pauseDuration: 0.30,
      pauseRemaining: 0,
      maxPasses: Infinity,
      passCount: 0,
    };
    const lightSweepBaseIntensity = {
      key: keyLight.intensity,
      spot: spotLight.intensity,
    };
    const environmentBaseIntensity = 1;
    const hemiBaseIntensity = hemiLight.intensity;
    const frameOnePreloader = {
      active: false,
      ready: false,
    };
    const startupLoader = document.getElementById('startupLoader');
    const enterPromptEl = document.getElementById('enterPrompt');

    /* --------------------------------------------------------------------- */
    /*  FRAME ONE HUD — typewriter headline + viewfinder chrome               */
    /*  Drives the moment the camera settles on Frame 1: type the headline    */
    /*  out character by character, hold, punctuate with a shutter flash,     */
    /*  then hand off to the Frame 2 cinematic (playAstronautSequence).       */
    /* --------------------------------------------------------------------- */
    const frameOneHUD = {
      enabled: true,
      text: 'CREATIVE\nPEOPLE\nNEED\nCREATIVE\nPEOPLE',
      charSpeed: 55,
      holdAfterTyped: 1200,
      shutterFlash: true,
      _timer: null,
      _started: false,
    };
    const hudClock = { running: false, elapsed: 0 };
    const frameOneOverlayEl = document.getElementById('frameOneOverlay');
    const frameOneTypewriterEl = document.getElementById('frameOneTypewriterText');
    const hudTimecodeEl = document.getElementById('hudTimecode');
    const shutterFlashEl = document.getElementById('shutterFlash');

    /* ------------------------------------------------------------------ */
    /*  AUDIO — ambient music + SFX + mobile haptics                       */
    /* ------------------------------------------------------------------ */
    // Ambient track — fades in when Frame 1 starts, fades out on exit
    const ambientMusic = new Audio('Ken Lusk - Holographic Origins [SpaceAmbient Channel] - SpaceAmbient.mp3');
    ambientMusic.loop = true;
    ambientMusic.volume = 0;
    ambientMusic.preload = 'auto';

    // Computer processing SFX — loops during typewriter, stops when done
    const typeSFX = new Audio('samuelfjohanns-computer-processing-sound-effect-01-122131.mp3');
    typeSFX.loop = true;
    typeSFX.volume = 0.55;
    typeSFX.preload = 'auto';

    // ------------------------------------------------------------------
    // Browser autoplay unlock
    // Browsers block audio.play() unless triggered by a user gesture.
    // We create a silent AudioContext; the first click/touch resumes it,
    // which also unlocks HTMLAudioElement playback in the same tab.
    // Any play calls queued before that gesture are flushed immediately.
    // ------------------------------------------------------------------
    let _audioUnlocked = false;
    const _audioQueue = [];   // fns to call once unlocked

    const _unlockCtx = new (window.AudioContext || window.webkitAudioContext)();

    function _flushAudioQueue() {
      if (_audioUnlocked) return;
      _audioUnlocked = true;
      _unlockCtx.resume();
      // Play a silent buffer — this is the classic iOS/Chrome unlock trick
      const buf = _unlockCtx.createBuffer(1, 1, 22050);
      const src = _unlockCtx.createBufferSource();
      src.buffer = buf;
      src.connect(_unlockCtx.destination);
      src.start(0);
      _audioQueue.forEach(fn => fn());
      _audioQueue.length = 0;
    }

    // Listen for ANY user gesture on the page
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt =>
      window.addEventListener(evt, _flushAudioQueue, { once: false, capture: true })
    );

    // Wrapper: play immediately if unlocked, else queue
    function safePlay(audioEl) {
      if (_audioUnlocked) {
        audioEl.play().catch(() => {});
      } else {
        _audioQueue.push(() => audioEl.play().catch(() => {}));
      }
    }

    let _ambientFadeTick = null;

    function fadeInAmbient(targetVol = 0.45, durationMs = 3500) {
      if (_ambientFadeTick) clearInterval(_ambientFadeTick);
      ambientMusic.currentTime = 0;
      ambientMusic.volume = 0;
      safePlay(ambientMusic);
      const steps = 60;
      const stepMs = durationMs / steps;
      const delta = targetVol / steps;
      _ambientFadeTick = setInterval(() => {
        ambientMusic.volume = Math.min(ambientMusic.volume + delta, targetVol);
        if (ambientMusic.volume >= targetVol) clearInterval(_ambientFadeTick);
      }, stepMs);
    }

    function fadeOutAmbient(durationMs = 1800) {
      if (_ambientFadeTick) clearInterval(_ambientFadeTick);
      const steps = 40;
      const stepMs = durationMs / steps;
      const delta = ambientMusic.volume / steps;
      _ambientFadeTick = setInterval(() => {
        ambientMusic.volume = Math.max(ambientMusic.volume - delta, 0);
        if (ambientMusic.volume <= 0) {
          clearInterval(_ambientFadeTick);
          ambientMusic.pause();
        }
      }, stepMs);
    }

    function startTypeSFX() {
      typeSFX.currentTime = 0;
      safePlay(typeSFX);
    }

    function stopTypeSFX() {
      typeSFX.pause();
      typeSFX.currentTime = 0;
    }

    function formatTimecode(seconds) {
      const pad = (n) => String(n).padStart(2, '0');
      const totalFrames = Math.floor(seconds * 24);
      const ff = totalFrames % 24;
      const totalSeconds = Math.floor(seconds);
      const ss = totalSeconds % 60;
      const mm = Math.floor(totalSeconds / 60) % 60;
      const hh = Math.floor(totalSeconds / 3600);
      return `${pad(hh)}:${pad(mm)}:${pad(ss)}:${pad(ff)}`;
    }

    function resetFrameOneOverlay() {
      if (frameOneHUD._timer) clearTimeout(frameOneHUD._timer);
      frameOneHUD._started = false;
      hudClock.running = false;
      hudClock.elapsed = 0;
      if (frameOneTypewriterEl) frameOneTypewriterEl.textContent = '';
      if (hudTimecodeEl) hudTimecodeEl.textContent = formatTimecode(0);
      if (frameOneOverlayEl) frameOneOverlayEl.classList.remove('is-visible', 'is-leaving');
      stopTypeSFX();
    }

    function finishFrameOneOverlay() {
      hudClock.running = false;
      stopTypeSFX();
      if (frameOneHUD.shutterFlash && shutterFlashEl) {
        shutterFlashEl.classList.add('is-flashing');
        setTimeout(() => shutterFlashEl.classList.remove('is-flashing'), 280);
      }
      if (frameOneOverlayEl) frameOneOverlayEl.classList.add('is-leaving');
      frameOnePreloader.active = false;
      playAstronautSequence();
    }

    function startFrameOneOverlay() {
      if (!frameOneHUD.enabled) {
        frameOnePreloader.active = false;
        playAstronautSequence();
        return;
      }
      if (frameOneHUD._started) return;
      frameOneHUD._started = true;
      hudClock.running = true;
      hudClock.elapsed = 0;
      if (frameOneOverlayEl) frameOneOverlayEl.classList.add('is-visible');

      // Start ambient music with slow fade-in
      fadeInAmbient(0.45, 3500);
      // Start computer SFX loop for the typewriter
      startTypeSFX();

      const text = frameOneHUD.text;
      let i = 0;
      const typeNext = () => {
        if (i <= text.length) {
          if (frameOneTypewriterEl) frameOneTypewriterEl.innerHTML = text.slice(0, i).replace(/\n/g, '<br>').replace(/\bNEED\b/g, '<span class="headline-need">NEED</span>');
          // Mobile haptic pulse on each character
          if (i > 0 && navigator.vibrate) navigator.vibrate(8);
          i += 1;
          frameOneHUD._timer = setTimeout(typeNext, frameOneHUD.charSpeed);
        } else {
          stopTypeSFX();
          frameOneHUD._timer = setTimeout(finishFrameOneOverlay, frameOneHUD.holdAfterTyped);
        }
      };
      typeNext();
    }

    const startupSequence = {
      active: true,
      ready: false,
      elapsed: 0,
      duration: 3,
    };
    keyLight.intensity = lightSweepBaseIntensity.key;
    spotLight.intensity = lightSweepBaseIntensity.spot;
    hemiLight.intensity = hemiBaseIntensity;

    function startIntroDescent() {
      resetFrameOneOverlay();
      const targetPos = getFrameOnePosition();
      introDescent.startPosition.set(targetPos.x, targetPos.y + introDescent.offsetY, targetPos.z);
      introDescent.endPosition.copy(targetPos);
      introDescent.elapsed = 0;
      introDescent.active = true;
      camera.position.copy(introDescent.startPosition);
      controls.target.copy(frameOneTarget);
      controls.update();
    }

    function updateIntroDescent(dt) {
      if (!introDescent.active) return;
      introDescent.elapsed = Math.min(introDescent.elapsed + dt, introDescent.duration);
      const t = introDescent.elapsed / introDescent.duration;
      // Smooth cubic ease-out
      const progress = 1 - Math.pow(1 - t, 3);
      camera.position.lerpVectors(introDescent.startPosition, introDescent.endPosition, progress);
      controls.target.copy(frameOneTarget);
      if (t >= 1) {
        introDescent.active = false;
        camera.position.copy(introDescent.endPosition);
        animationCamera.startPosition.copy(introDescent.endPosition);
        animationCamera.startTarget.copy(frameOneTarget);
        startFrameOneOverlay();
      }
    }

    function beginFrameOnePreloader() {
      const entry = findAstronautEntry();
      frameOnePreloader.ready = true;
      frameOnePreloader.active = true;
      startIntroDescent();
      keyLight.intensity = lightSweepBaseIntensity.key;
      spotLight.intensity = lightSweepBaseIntensity.spot;
      hemiLight.intensity = hemiBaseIntensity;
      scene.environmentIntensity = environmentBaseIntensity;
      controls.enabled = false;
      if (entry && entry.mixer && entry.actions.floating) {
        const action = entry.actions.floating;
        if (entry.activeAction && entry.activeAction !== action) entry.activeAction.stop();
        entry.animSettings.clip = 'floating';
        entry.animSettings.playing = true;
        entry.animSettings.loop = true;
        entry.activeAction = action;
        entry.activeActionName = 'floating';
        action.reset();
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.clampWhenFinished = false;
        action.setEffectiveTimeScale(Math.abs(entry.animSettings.timeScale) || 1);
        action.play();
      }
    }

    function updateStartupSequence(dt) {
      if (!startupSequence.active) return;
      startupSequence.elapsed = Math.min(startupSequence.elapsed + dt, startupSequence.duration);
      if (startupSequence.elapsed >= startupSequence.duration && startupSequence.ready) {
        startupSequence.active = false;
        // Show the "Enter" prompt — don't auto-dismiss
        // The click is what unlocks browser audio
        if (enterPromptEl) enterPromptEl.classList.add('is-ready');
      }
    }

    function _launchExperience() {
      if (!enterPromptEl || !enterPromptEl.classList.contains('is-ready')) return;
      enterPromptEl.classList.remove('is-ready');
      // This runs inside a direct user-gesture stack → audio is unlocked here
      _flushAudioQueue();
      startupLoader.classList.add('is-hidden');
      beginFrameOnePreloader();
    }

    if (enterPromptEl) {
      enterPromptEl.addEventListener('click', _launchExperience);
      enterPromptEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') _launchExperience();
      });
    }

    function updateLightSweep(dt) {
      if (!frameOnePreloader.ready) return;
      if (!lightSweepSettings.enabled) return;

      if (lightSweepSettings.pauseRemaining > 0) {
        const pauseDuration = Math.max(0.01, lightSweepSettings.pauseDuration);
        lightSweepSettings.pauseRemaining = Math.max(0, lightSweepSettings.pauseRemaining - dt);
        const pauseProgress = 1 - lightSweepSettings.pauseRemaining / pauseDuration;
        const fadeProgress = pauseProgress < 0.5
          ? 1 - (pauseProgress * 2) * (pauseProgress * 2) * (3 - 2 * pauseProgress * 2)
          : ((pauseProgress - 0.5) * 2) * ((pauseProgress - 0.5) * 2) * (3 - 2 * ((pauseProgress - 0.5) * 2));
        keyLight.intensity = lightSweepBaseIntensity.key * fadeProgress;
        spotLight.intensity = lightSweepBaseIntensity.spot * fadeProgress;
        if (pauseProgress >= 0.5) {
          keyLight.target.position.z = lightSweepSettings.range;
          spotLight.position.z = -lightSweepSettings.range;
        }
        if (lightSweepSettings.pauseRemaining === 0) {
          lightSweepSettings.phase = 0;
          keyLight.intensity = lightSweepBaseIntensity.key;
          spotLight.intensity = lightSweepBaseIntensity.spot;
        }
        return;
      }

      lightSweepSettings.phase = Math.min(1, lightSweepSettings.phase + dt * lightSweepSettings.speed);
      const progress = lightSweepSettings.phase * lightSweepSettings.phase * (3 - 2 * lightSweepSettings.phase);
      keyLight.target.position.z = lightSweepSettings.range - progress * lightSweepSettings.range * 2;
      spotLight.position.z = -lightSweepSettings.range + progress * lightSweepSettings.range * 2;
      keyLight.intensity = lightSweepBaseIntensity.key;
      spotLight.intensity = lightSweepBaseIntensity.spot;
      hemiLight.intensity = hemiBaseIntensity;
      scene.environmentIntensity = environmentBaseIntensity;

      if (lightSweepSettings.phase >= 1) {
        lightSweepSettings.passCount += 1;
        if (lightSweepSettings.maxPasses !== Infinity && lightSweepSettings.passCount >= lightSweepSettings.maxPasses) {
          lightSweepSettings.enabled = false;
        } else {
          lightSweepSettings.pauseRemaining = Math.max(0.01, lightSweepSettings.pauseDuration);
        }
      }
    }

    const spotHelper = new THREE.SpotLightHelper(spotLight);
    spotHelper.visible = false;
    const keyHelper = new THREE.DirectionalLightHelper(keyLight, 0.7, 0x9bd4ff);
    keyHelper.visible = false;

    /* --------------------------------------------------------------------- */
    /*  MULTI-MODEL LOADING + PER-MODEL CONTROLS                              */
    /*  Every model gets: position/rotation/scale sliders, wireframe/visible/ */
    /*  shadow toggles, its own animation clip player, and "Drag in viewport"*/
    /*  buttons that attach a TransformControls gizmo so you can move,       */
    /*  rotate, or resize it directly with the mouse.                        */
    /* --------------------------------------------------------------------- */

    const loadingFill = document.getElementById('loadingFill');
    const loadingText = document.getElementById('loadingText');
    const loadingScreen = document.getElementById('loading');

    let pendingLoads = 0;
    function beginLoad() { pendingLoads++; }
    function endLoad() {
      pendingLoads = Math.max(0, pendingLoads - 1);
      if (pendingLoads === 0 && loadingScreen) {
        loadingScreen.style.opacity = '0';
        setTimeout(() => (loadingScreen.style.display = 'none'), 400);
      }
    }

    const loader = new GLTFLoader();
    const modelsFolder = gui.addFolder('Models');
    const modelEntries = [];

    function applyEntryTransform(entry) {
      if (!entry.root) return;
      entry.root.position.set(entry.settings.posX, entry.settings.posY, entry.settings.posZ);
      entry.root.rotation.set(
        THREE.MathUtils.degToRad(entry.settings.rotX),
        THREE.MathUtils.degToRad(entry.settings.rotY),
        THREE.MathUtils.degToRad(entry.settings.rotZ)
      );
      entry.root.scale.setScalar(entry.settings.scale);
    }

    function setActiveClip(entry, name) {
      if (entry.mixer && entry.activeAction) {
        entry.activeAction.fadeOut(entry.animSettings.crossfade);
      }
      if (name === 'None' || !entry.actions[name]) {
        entry.activeAction = null;
        entry.activeActionName = 'None';
        return;
      }
      const next = entry.actions[name];
      next.reset();
      next.setLoop(entry.animSettings.loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
      next.clampWhenFinished = !entry.animSettings.loop;
      next.setEffectiveTimeScale(entry.animSettings.timeScale);
      next.fadeIn(entry.animSettings.crossfade).play();
      if (!entry.animSettings.playing) next.paused = true;
      entry.activeAction = next;
      entry.activeActionName = name;
    }

    const animationCamera = {
      active: false,
      duration: 1.8,
      elapsed: 0,
      startFov: 22,
      endFov: 67,
      startPosition: new THREE.Vector3(),
      startTarget: new THREE.Vector3(),
      endPosition: new THREE.Vector3(1.68, 0.29, 0.33),
      endTarget: new THREE.Vector3(-4.05, 6.00, -0.15),
    };

    const cinematicSequence = {
      phase: 'idle',
      fovBlastDuration: 1.5,
      fovBlastElapsed: 0,
      fovBlastStartFov: 67,
      reverseDuration: 1,
      reverseElapsed: 0,
      reverseStartFov: 67,
      reverseEndFov: 170,
      reverseStartPosition: new THREE.Vector3(),
      reverseEndPosition: new THREE.Vector3(),
      reverseExposure: 0,
    };
    const cinematicBlack = document.getElementById('cinematicBlack');
    animationCamera.startFov = camera.fov;
    animationCamera.startPosition.copy(camera.position);
    animationCamera.startTarget.copy(controls.target);

    function findAstronautEntry() {
      return modelEntries.find((entry) => entry.label === 'Astronaut');
    }

    function playAstronautSequence() {
      const entry = findAstronautEntry();
      if (!entry || !entry.mixer || !entry.actions.floating) return;

      if (frameOneOverlayEl) frameOneOverlayEl.classList.add('is-leaving');
      hudClock.running = false;

      cinematicSequence.phase = 'camera-in';
      cinematicBlack.style.opacity = '0';
      starMaterials.forEach(({ material, opacity, size }) => {
        material.opacity = opacity;
        material.size = size;
      });
      cinematicSequence.reverseElapsed = 0;
      animationCamera.active = false;
      animationCamera.elapsed = 0;
      animationCamera.startFov = camera.fov;
      animationCamera.startPosition.copy(camera.position);
      animationCamera.startTarget.copy(controls.target);
      controls.enabled = false;

      entry.animSettings.clip = 'floating';
      entry.animSettings.playing = true;
      entry.animSettings.loop = false;
      const action = entry.actions.floating;
      if (entry.activeAction && entry.activeAction !== action) entry.activeAction.stop();
      entry.activeAction = action;
      entry.activeActionName = 'floating';
      // If the animation is already playing (from the preloader), just switch
      // the loop mode in-place so it continues without any visible reset/glitch.
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.setEffectiveTimeScale(Math.abs(entry.animSettings.timeScale) || 1);
      if (!action.isRunning()) {
        action.reset();
        action.play();
      }
    }

    function resetAstronautSequence() {
      const entry = findAstronautEntry();
      cinematicSequence.phase = 'idle';
      cinematicBlack.style.opacity = '0';
      starMaterials.forEach(({ material, opacity, size }) => {
        material.opacity = opacity;
        material.size = size;
      });
      animationCamera.active = false;
      introDescent.active = false;
      controls.enabled = true;
      camera.position.copy(getFrameOnePosition());
      controls.target.copy(frameOneTarget);
      controls.update();
      camera.fov = animationCamera.startFov || 22;
      camera.updateProjectionMatrix();
      if (entry && entry.activeAction) {
        entry.activeAction.stop();
        entry.activeAction.reset();
        entry.activeActionName = 'None';
      }
      frameOnePreloader.active = true;
      resetFrameOneOverlay();
      startFrameOneOverlay();
    }

    function startAnimationCamera() {
      animationCamera.active = true;
      animationCamera.elapsed = 0;
      animationCamera.startFov = camera.fov;
      animationCamera.startPosition.copy(camera.position);
      animationCamera.startTarget.copy(controls.target);
      controls.enabled = false;
    }

    function updateAnimationCamera(dt) {
      if (!animationCamera.active) return;
      animationCamera.elapsed = Math.min(animationCamera.elapsed + dt, animationCamera.duration);
      const linearProgress = animationCamera.elapsed / animationCamera.duration;
      const progress = linearProgress * linearProgress * (3 - 2 * linearProgress);
      camera.position.lerpVectors(animationCamera.startPosition, animationCamera.endPosition, progress);
      controls.target.lerpVectors(animationCamera.startTarget, animationCamera.endTarget, progress);
      camera.fov = THREE.MathUtils.lerp(animationCamera.startFov, animationCamera.endFov, progress);
      camera.updateProjectionMatrix();
      if (linearProgress >= 1) {
        animationCamera.active = false;
        cinematicSequence.phase = 'fov-blast';
        cinematicSequence.fovBlastElapsed = 0;
        cinematicSequence.fovBlastStartFov = camera.fov;
        // Pre-compute reverse positions so they are ready when fov-blast finishes
        cinematicSequence.reverseElapsed = 0;
        cinematicSequence.reverseStartFov = cinematicSequence.reverseEndFov;
        cinematicSequence.reverseStartPosition.copy(camera.position);
        const facingDirection = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        cinematicSequence.reverseEndPosition.copy(camera.position).addScaledVector(facingDirection, 50.0);
      }
    }

    function updateCinematicSequence(dt) {
      if (cinematicSequence.phase === 'camera-in') {
        animationCamera.active = true;
        updateAnimationCamera(dt);
        return;
      }
      if (cinematicSequence.phase === 'fov-blast') {
        cinematicSequence.fovBlastElapsed = Math.min(
          cinematicSequence.fovBlastElapsed + dt,
          cinematicSequence.fovBlastDuration
        );
        const t = cinematicSequence.fovBlastElapsed / cinematicSequence.fovBlastDuration;
        // smoothstep — gradual, even widening
        const progress = t * t * (3 - 2 * t);
        camera.fov = THREE.MathUtils.lerp(
          cinematicSequence.fovBlastStartFov,
          cinematicSequence.reverseEndFov,
          progress
        );
        camera.updateProjectionMatrix();
        if (t >= 1) {
          camera.fov = cinematicSequence.reverseEndFov;
          camera.updateProjectionMatrix();
          cinematicSequence.phase = 'reverse';
          cinematicSequence.reverseElapsed = 0;
        }
        return;
      }
      if (cinematicSequence.phase === 'reverse') {
        cinematicSequence.reverseElapsed = Math.min(
          cinematicSequence.reverseElapsed + dt,
          cinematicSequence.reverseDuration
        );
        const linearProgress = cinematicSequence.reverseElapsed / cinematicSequence.reverseDuration;
        // easeInQuart — starts slow then blasts away fast
        const progress = linearProgress * linearProgress * linearProgress * linearProgress;
        const exposureProgress = Math.min(1, progress * 1.18);
        camera.position.lerpVectors(
          cinematicSequence.reverseStartPosition,
          cinematicSequence.reverseEndPosition,
          progress
        );
        controls.target.copy(animationCamera.endTarget);
        camera.fov = THREE.MathUtils.lerp(
          cinematicSequence.reverseStartFov,
          cinematicSequence.reverseEndFov,
          progress
        );
        starMaterials.forEach(({ material, opacity, size }) => {
          material.opacity = THREE.MathUtils.lerp(opacity, Math.min(1, opacity * 1.9), exposureProgress);
          material.size = THREE.MathUtils.lerp(size, size * 1.8, exposureProgress);
        });
        cinematicBlack.style.opacity = String(exposureProgress * exposureProgress);
        camera.updateProjectionMatrix();
        if (linearProgress >= 1) {
          cinematicSequence.phase = 'idle';
          controls.enabled = true;
        }
        return;
      }
    }

    function buildModelFolder(entry) {
      const f = modelsFolder.addFolder(entry.label);

      f.add(entry.settings, 'posX', -10, 10, 0.01).name('Position X').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'posY', -10, 10, 0.01).name('Position Y').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'posZ', -10, 10, 0.01).name('Position Z').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'rotX', 0, 360, 1).name('Rotation X°').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'rotY', 0, 360, 1).name('Rotation Y°').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'rotZ', 0, 360, 1).name('Rotation Z°').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'scale', 0.01, 5, 0.01).name('Scale').listen().onChange(() => applyEntryTransform(entry));
      f.add(entry.settings, 'visible').name('Visible').onChange((v) => { if (entry.root) entry.root.visible = v; });
      f.add(entry.settings, 'wireframe').name('Wireframe').onChange((v) => {
        if (!entry.root) return;
        entry.root.traverse((c) => { if (c.isMesh) c.material.wireframe = v; });
      });
      f.add(entry.settings, 'castShadow').name('Cast Shadow').onChange((v) => {
        if (!entry.root) return;
        entry.root.traverse((c) => { if (c.isMesh) c.castShadow = v; });
      });

      const transformActions = {
        move() { if (entry.root) { transformControls.setMode('translate'); transformControls.attach(entry.root); } },
        rotate() { if (entry.root) { transformControls.setMode('rotate'); transformControls.attach(entry.root); } },
        resize() { if (entry.root) { transformControls.setMode('scale'); transformControls.attach(entry.root); } },
        deselect() { transformControls.detach(); },
      };
      const tf = f.addFolder('Drag in viewport');
      tf.add(transformActions, 'move').name('Move (drag)');
      tf.add(transformActions, 'rotate').name('Rotate (drag)');
      tf.add(transformActions, 'resize').name('Resize (drag)');
      tf.add(transformActions, 'deselect').name('Deselect');

      const af = f.addFolder('Animation');
      entry.clipController = af.add(entry.animSettings, 'clip', entry.clipNames).name('Clip').onChange((v) => setActiveClip(entry, v));
      const animationActions = {
        playFrameSequence: playAstronautSequence,
        resetFrameSequence: resetAstronautSequence,
      };
      af.add(animationActions, 'playFrameSequence').name('Play frame 1 → 2');
      af.add(animationActions, 'resetFrameSequence').name('Reset sequence');
      af.add(entry.animSettings, 'timeScale', -2, 2, 0.01).name('Speed').onChange((v) => { if (entry.activeAction) entry.activeAction.setEffectiveTimeScale(v); });
      af.add(entry.animSettings, 'loop').name('Loop').onChange((v) => {
        if (entry.activeAction) {
          entry.activeAction.setLoop(v ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
          entry.activeAction.clampWhenFinished = !v;
        }
      });
      af.add(entry.animSettings, 'crossfade', 0, 2, 0.05).name('Crossfade (s)');

      f.open();
    }

    function loadModel(path, label, initialPos = [0, 0, 0]) {
      beginLoad();
      const entry = {
        label, path,
        root: null,
        mixer: null,
        actions: {},
        activeAction: null,
        activeActionName: 'None',
        clipNames: ['None'],
        clipController: null,
        settings: {
          posX: initialPos[0], posY: initialPos[1], posZ: initialPos[2],
          rotX: 0, rotY: 91, rotZ: 6,
          scale: 1,
          wireframe: false,
          visible: true,
          castShadow: true,
        },
        animSettings: {
          clip: 'floating',
          playing: true,
          timeScale: -1.88,
          loop: true,
          crossfade: 0,
        },
      };
      modelEntries.push(entry);
      buildModelFolder(entry);

      loader.load(
        path,
        (gltf) => {
          entry.root = gltf.scene;
          entry.root.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach((mat) => {
                  if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
                  if (mat.emissiveMap) mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                  mat.needsUpdate = true;
                });
              }
            }
          });
          scene.add(entry.root);
          applyEntryTransform(entry);

          if (gltf.animations && gltf.animations.length > 0) {
            entry.mixer = new THREE.AnimationMixer(entry.root);
            gltf.animations.forEach((clip) => {
              entry.actions[clip.name] = entry.mixer.clipAction(clip);
              entry.clipNames.push(clip.name);
            });
            entry.clipController.options(entry.clipNames);
            const defaultClip = entry.clipNames.includes(entry.animSettings.clip)
              ? entry.animSettings.clip
              : (entry.clipNames[1] || 'None');
            entry.animSettings.clip = defaultClip;
            setActiveClip(entry, defaultClip);
          } else {
            entry.clipController.options(entry.clipNames);
          }

          endLoad();
          startupSequence.ready = true;
          if (!startupSequence.active) beginFrameOnePreloader();
        },
        (xhr) => {
          if (xhr.total) {
            const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
            if (loadingFill) loadingFill.style.width = pct + '%';
            if (loadingText) loadingText.textContent = label + ': ' + pct + '%';
          }
        },
        (err) => {
          if (loadingText) loadingText.textContent = 'Failed to load ' + path + ' — check the path and that you are running a local server (not file://)';
          console.error(err);
          endLoad();
        }
      );

      return entry;
    }

    // TransformControls: click a model's "Drag in viewport" buttons to attach it here,
    // then drag the on-screen gizmo to move / rotate / resize that model.
    const transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });
    transformControls.addEventListener('objectChange', () => {
      const obj = transformControls.object;
      const entry = modelEntries.find((m) => m.root === obj);
      if (!entry) return;
      if (transformControls.getMode() === 'scale') {
        const avg = (obj.scale.x + obj.scale.y + obj.scale.z) / 3;
        obj.scale.setScalar(avg);
        entry.settings.scale = avg;
      }
      entry.settings.posX = obj.position.x;
      entry.settings.posY = obj.position.y;
      entry.settings.posZ = obj.position.z;
      entry.settings.rotX = THREE.MathUtils.radToDeg(obj.rotation.x);
      entry.settings.rotY = THREE.MathUtils.radToDeg(obj.rotation.y);
      entry.settings.rotZ = THREE.MathUtils.radToDeg(obj.rotation.z);
    });

    const lightTransformControls = new TransformControls(camera, renderer.domElement);
    lightTransformControls.setMode('translate');
    lightTransformControls.setSize(0.8);
    lightTransformControls.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });

    function attachLightForDragging(light) {
      lightTransformControls.setMode('translate');
      lightTransformControls.attach(light);
    }

    function detachLightDragging() {
      lightTransformControls.detach();
    }

    lightTransformControls.addEventListener('objectChange', () => {
      const light = lightTransformControls.object;
      if (light === spotLight) {
        spotSettings.posX = light.position.x;
        spotSettings.posY = light.position.y;
        spotSettings.posZ = light.position.z;
      }
      if (light === keyLight) {
        keySettings.posX = light.position.x;
        keySettings.posY = light.position.y;
        keySettings.posZ = light.position.z;
      }
    });

    // Load the astronaut model.
    loadModel('astronauta.glb', 'Astronaut', [-0.9, 0, 0]);

    /* --------------------------------------------------------------------- */
    /*  POST PROCESSING — BLOOM + COLOR GRADING                               */
    /* --------------------------------------------------------------------- */

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomSettings = {
      enabled: true,
      strength: 0.03,
      radius: 1,
      threshold: 1,
    };

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      bloomSettings.strength,
      bloomSettings.radius,
      bloomSettings.threshold
    );
    composer.addPass(bloomPass);

    const ColorGradeShader = {
      uniforms: {
        tDiffuse: { value: null },
        brightness: { value: 0.0 },
        contrast: { value: 1.0 },
        saturation: { value: 0.99 },
        hue: { value: 0.15 },
        exposure: { value: 2.0 },
        vignette: { value: 0.46 },
      },
      vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
      fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float brightness;
    uniform float contrast;
    uniform float saturation;
    uniform float hue;
    uniform float exposure;
    uniform float vignette;
    varying vec2 vUv;

    vec3 adjustHue(vec3 color, float hueAdjust) {
      const vec3 k = vec3(0.57735, 0.57735, 0.57735);
      float cosAngle = cos(hueAdjust);
      return color * cosAngle + cross(k, color) * sin(hueAdjust) + k * dot(k, color) * (1.0 - cosAngle);
    }

    void main() {
      vec4 texel = texture2D(tDiffuse, vUv);
      vec3 color = texel.rgb;

      color *= pow(2.0, exposure);
      color += brightness;
      color = (color - 0.5) * contrast + 0.5;

      float gray = dot(color, vec3(0.299, 0.587, 0.114));
      color = mix(vec3(gray), color, saturation);

      color = adjustHue(color, hue);

      vec2 uvCentered = vUv - 0.5;
      float vig = 1.0 - vignette * smoothstep(0.15, 0.85, length(uvCentered) * 1.4);
      color *= clamp(vig, 0.0, 1.0);

      gl_FragColor = vec4(clamp(color, 0.0, 1.0), texel.a);
    }
  `
    };

    const colorGradePass = new ShaderPass(ColorGradeShader);
    composer.addPass(colorGradePass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    const colorGradeSettings = {
      brightness: 0.0,
      contrast: 1.0,
      saturation: 0.99,
      hue: 0.15,
      exposure: 2.0,
      vignette: 0.46,
    };

    /* --------------------------------------------------------------------- */
    /*  SCENE SETTINGS (bg, ambient, hemi, tone mapping, ground/grid)          */
    /* --------------------------------------------------------------------- */

    const sceneSettings = {
      background: '#000000',
      ambientIntensity: 0,
      hemiIntensity: 1.31,
      toneMappingExposure: 3.0,
      showGround: false,
    };

    /* --------------------------------------------------------------------- */
    /*  CAMERA SETTINGS                                                       */
    /* --------------------------------------------------------------------- */

    const camSettings = {
      fov: 22,
      posX: camera.position.x,
      posY: camera.position.y,
      posZ: camera.position.z,
      targetX: controls.target.x,
      targetY: controls.target.y,
      targetZ: controls.target.z,
      flySpeed: 2.5,
    };

    /* --------------------------------------------------------------------- */
    /*  GUI — Scene / Lighting / Post Processing / Camera                     */
    /* --------------------------------------------------------------------- */

    // ---- Scene ----
    const sceneFolder = gui.addFolder('Scene');
    sceneFolder.addColor(sceneSettings, 'background').name('Background').onChange((v) => {
      scene.background.set(v);
    });
    sceneFolder.add(sceneSettings, 'ambientIntensity', 0, 3, 0.01).name('Ambient Intensity').onChange((v) => {
      ambientLight.intensity = v;
    });
    sceneFolder.add(sceneSettings, 'hemiIntensity', 0, 3, 0.01).name('Hemisphere Intensity').onChange((v) => {
      hemiLight.intensity = v;
    });
    sceneFolder.add(sceneSettings, 'toneMappingExposure', 0, 3, 0.01).name('Tone Map Exposure').onChange((v) => {
      renderer.toneMappingExposure = v;
    });
    sceneFolder.add(sceneSettings, 'showGround').name('Show Ground').onChange((v) => (ground.visible = v));

    // ---- Lighting > Spotlight ----
    const lightFolder = gui.addFolder('Lighting');
    const sweepFolder = lightFolder.addFolder('Light Sweep Loop');
    sweepFolder.add(lightSweepSettings, 'enabled').name('Enabled').onChange((enabled) => {
      lightSweepSettings.pauseRemaining = 0;
      if (!enabled) {
        keyLight.intensity = lightSweepBaseIntensity.key;
        spotLight.intensity = lightSweepBaseIntensity.spot;
      }
    });
    sweepFolder.add(lightSweepSettings, 'speed', 0.1, 4, 0.01).name('Speed');
    sweepFolder.add(lightSweepSettings, 'pauseDuration', 0, 2, 0.05).name('Lights-off pause');
    sweepFolder.add(lightSweepSettings, 'range', 1, 40, 0.1).name('Range').onChange((v) => {
      keyLight.target.position.z = v;
      spotLight.position.z = -v;
    });
    const keyFolder = lightFolder.addFolder('Key Light');
    const keySettings = {
      color: '#7a7a7a',
      intensity: keyLight.intensity,
      posX: keyLight.position.x,
      posY: keyLight.position.y,
      posZ: keyLight.position.z,
      targetX: keyLight.target.position.x,
      targetY: keyLight.target.position.y,
      targetZ: keyLight.target.position.z,
      castShadow: keyLight.castShadow,
      showHelper: true,
    };
    keyFolder.addColor(keySettings, 'color').name('Color').onChange((v) => keyLight.color.set(v));
    keyFolder.add(keySettings, 'intensity', 0, 100, 0.1).name('Intensity').onChange((v) => {
      lightSweepBaseIntensity.key = v;
      if (lightSweepSettings.pauseRemaining === 0) keyLight.intensity = v;
    });
    keyFolder.add(keySettings, 'posX', -30, 30, 0.1).name('Pos X').onChange((v) => (keyLight.position.x = v));
    keyFolder.add(keySettings, 'posY', -10, 30, 0.1).name('Pos Y').onChange((v) => (keyLight.position.y = v));
    keyFolder.add(keySettings, 'posZ', -30, 30, 0.1).name('Pos Z').onChange((v) => (keyLight.position.z = v));
    keyFolder.add(keySettings, 'targetX', -20, 20, 0.1).name('Target X').onChange((v) => (keyLight.target.position.x = v));
    keyFolder.add(keySettings, 'targetY', -20, 20, 0.1).name('Target Y').onChange((v) => (keyLight.target.position.y = v));
    keyFolder.add(keySettings, 'targetZ', -40, 40, 0.1).name('Target Z').listen().onChange((v) => (keyLight.target.position.z = v));
    keyFolder.add(keySettings, 'castShadow').name('Cast Shadow').onChange((v) => (keyLight.castShadow = v));
    keyFolder.add(keySettings, 'showHelper').name('Show Helper').onChange((v) => (keyHelper.visible = v));
    keyFolder.add({ drag: () => attachLightForDragging(keyLight) }, 'drag').name('Drag in viewport');
    keyFolder.add({ stop: detachLightDragging }, 'stop').name('Stop dragging');
    const spotFolder = lightFolder.addFolder('Spot Light');
    const spotSettings = {
      color: '#ff8fcb',
      intensity: spotLight.intensity,
      distance: spotLight.distance,
      angleDeg: THREE.MathUtils.radToDeg(spotLight.angle),
      penumbra: spotLight.penumbra,
      decay: spotLight.decay,
      posX: spotLight.position.x,
      posY: spotLight.position.y,
      posZ: spotLight.position.z,
      targetX: spotLight.target.position.x,
      targetY: spotLight.target.position.y,
      targetZ: spotLight.target.position.z,
      castShadow: true,
      showHelper: true,
    };
    spotFolder.addColor(spotSettings, 'color').name('Color').onChange((v) => spotLight.color.set(v));
    spotFolder.add(spotSettings, 'intensity', 0, 1000, 0.1).name('Intensity').onChange((v) => {
      lightSweepBaseIntensity.spot = v;
      if (lightSweepSettings.pauseRemaining === 0) spotLight.intensity = v;
    });
    spotFolder.add(spotSettings, 'distance', 0, 50, 0.5).name('Distance').onChange((v) => (spotLight.distance = v));
    spotFolder.add(spotSettings, 'angleDeg', 1, 90, 1).name('Angle°').onChange((v) => (spotLight.angle = THREE.MathUtils.degToRad(v)));
    spotFolder.add(spotSettings, 'penumbra', 0, 1, 0.01).name('Penumbra').onChange((v) => (spotLight.penumbra = v));
    spotFolder.add(spotSettings, 'decay', 0, 4, 0.05).name('Decay').onChange((v) => (spotLight.decay = v));
    spotFolder.add(spotSettings, 'posX', -20, 20, 0.1).name('Pos X').onChange((v) => (spotLight.position.x = v));
    spotFolder.add(spotSettings, 'posY', 0, 20, 0.1).name('Pos Y').onChange((v) => (spotLight.position.y = v));
    spotFolder.add(spotSettings, 'posZ', -40, 40, 0.1).name('Pos Z').listen().onChange((v) => (spotLight.position.z = v));
    spotFolder.add(spotSettings, 'targetX', -20, 20, 0.1).name('Target X').onChange((v) => (spotLight.target.position.x = v));
    spotFolder.add(spotSettings, 'targetY', -20, 20, 0.1).name('Target Y').onChange((v) => (spotLight.target.position.y = v));
    spotFolder.add(spotSettings, 'targetZ', -20, 20, 0.1).name('Target Z').onChange((v) => (spotLight.target.position.z = v));
    spotFolder.add(spotSettings, 'castShadow').name('Cast Shadow').onChange((v) => (spotLight.castShadow = v));
    spotFolder.add(spotSettings, 'showHelper').name('Show Helper').onChange((v) => (spotHelper.visible = v));
    spotFolder.add({ drag: () => attachLightForDragging(spotLight) }, 'drag').name('Drag in viewport');
    spotFolder.add({ stop: detachLightDragging }, 'stop').name('Stop dragging');

    // ---- Post Processing > Bloom ----
    const postFolder = gui.addFolder('Post Processing');
    const bloomFolder = postFolder.addFolder('Bloom / Glow');
    bloomFolder.add(bloomSettings, 'enabled').name('Enabled').onChange((v) => (bloomPass.enabled = v));
    bloomFolder.add(bloomSettings, 'strength', 0, 3, 0.01).name('Glow Intensity').onChange((v) => (bloomPass.strength = v));
    bloomFolder.add(bloomSettings, 'radius', 0, 1, 0.01).name('Glow Spread (Radius)').onChange((v) => (bloomPass.radius = v));
    bloomFolder.add(bloomSettings, 'threshold', 0, 1, 0.01).name('Glow Threshold').onChange((v) => (bloomPass.threshold = v));

    // ---- Post Processing > Color Grading ----
    const gradeFolder = postFolder.addFolder('Color Grading');
    gradeFolder.add(colorGradeSettings, 'brightness', -0.5, 0.5, 0.005).name('Brightness').onChange((v) => (colorGradePass.uniforms.brightness.value = v));
    gradeFolder.add(colorGradeSettings, 'contrast', 0, 2, 0.01).name('Contrast').onChange((v) => (colorGradePass.uniforms.contrast.value = v));
    gradeFolder.add(colorGradeSettings, 'saturation', 0, 2, 0.01).name('Saturation').onChange((v) => (colorGradePass.uniforms.saturation.value = v));
    gradeFolder.add(colorGradeSettings, 'hue', -Math.PI, Math.PI, 0.01).name('Hue Shift').onChange((v) => (colorGradePass.uniforms.hue.value = v));
    gradeFolder.add(colorGradeSettings, 'exposure', -2, 2, 0.01).name('Exposure').onChange((v) => (colorGradePass.uniforms.exposure.value = v));
    gradeFolder.add(colorGradeSettings, 'vignette', 0, 1.5, 0.01).name('Vignette').onChange((v) => (colorGradePass.uniforms.vignette.value = v));

    // ---- Camera ----
    const camFolder = gui.addFolder('Camera');
    camFolder.add(camSettings, 'fov', 10, 120, 1).name('FOV').onChange((v) => {
      camera.fov = v;
      camera.updateProjectionMatrix();
    });
    camFolder.add(camSettings, 'posX', -30, 30, 0.01).name('Position X').listen().onChange(applyCamPos);
    camFolder.add(camSettings, 'posY', -30, 30, 0.01).name('Position Y').listen().onChange(applyCamPos);
    camFolder.add(camSettings, 'posZ', -30, 30, 0.01).name('Position Z').listen().onChange(applyCamPos);
    camFolder.add(camSettings, 'targetX', -30, 30, 0.01).name('Look-At X').listen().onChange(applyCamTarget);
    camFolder.add(camSettings, 'targetY', -30, 30, 0.01).name('Look-At Y').listen().onChange(applyCamTarget);
    camFolder.add(camSettings, 'targetZ', -30, 30, 0.01).name('Look-At Z').listen().onChange(applyCamTarget);
    camFolder.add(camSettings, 'flySpeed', 0.5, 15, 0.1).name('Fly Speed');

    const introFolder = camFolder.addFolder('Intro Descent');
    introFolder.add(introDescent, 'duration', 0.5, 6, 0.1).name('Duration (s)');
    introFolder.add(introDescent, 'offsetY', 0, 10, 0.1).name('Height Offset').onChange(() => {
      if (startupSequence.active) camera.position.copy(getAboveFrameOnePosition());
    });
    introFolder.add({ replay: () => startIntroDescent() }, 'replay').name('Replay Descent');

    // ---- Frame One HUD (typewriter headline + viewfinder chrome) ----
    const frameOneFolder = gui.addFolder('Frame One HUD');
    frameOneFolder.add(frameOneHUD, 'enabled').name('Enabled');
    frameOneFolder.add(frameOneHUD, 'text').name('Headline Text');
    frameOneFolder.add(frameOneHUD, 'charSpeed', 10, 200, 1).name('Type Speed (ms/char)');
    frameOneFolder.add(frameOneHUD, 'holdAfterTyped', 0, 4000, 50).name('Hold After Typed (ms)');
    frameOneFolder.add(frameOneHUD, 'shutterFlash').name('Shutter Flash on Cut');
    frameOneFolder.add({ replay: () => { resetFrameOneOverlay(); startFrameOneOverlay(); } }, 'replay').name('Replay Typewriter');

    function applyCamPos() {
      camera.position.set(camSettings.posX, camSettings.posY, camSettings.posZ);
    }
    function applyCamTarget() {
      controls.target.set(camSettings.targetX, camSettings.targetY, camSettings.targetZ);
    }

    modelsFolder.open();
    sceneFolder.open();
    lightFolder.open();
    spotFolder.open();
    postFolder.open();
    camFolder.open();
    frameOneFolder.open();

    /* --------------------------------------------------------------------- */
    /*  WASD / QE FLY MOVEMENT (layered on top of OrbitControls)              */
    /* --------------------------------------------------------------------- */

    const keys = {};
    window.addEventListener('keydown', (e) => (keys[e.code] = true));
    window.addEventListener('keyup', (e) => (keys[e.code] = false));

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveDelta = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);

    function updateFlyMovement(dt) {
      const speed = camSettings.flySpeed * dt;
      let moved = false;
      moveDelta.set(0, 0, 0);

      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      right.crossVectors(forward, up).normalize();

      if (keys['KeyW']) { moveDelta.addScaledVector(forward, speed); moved = true; }
      if (keys['KeyS']) { moveDelta.addScaledVector(forward, -speed); moved = true; }
      if (keys['KeyA']) { moveDelta.addScaledVector(right, -speed); moved = true; }
      if (keys['KeyD']) { moveDelta.addScaledVector(right, speed); moved = true; }
      if (keys['KeyE']) { moveDelta.y += speed; moved = true; }
      if (keys['KeyQ']) { moveDelta.y -= speed; moved = true; }

      if (moved) {
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
      }
    }

    /* --------------------------------------------------------------------- */
    /*  RESIZE                                                                */
    /* --------------------------------------------------------------------- */

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);

      if (startupSequence.active) {
        camera.position.copy(getAboveFrameOnePosition());
        controls.target.copy(frameOneTarget);
        controls.update();
      } else if (introDescent.active) {
        const targetPos = getFrameOnePosition();
        introDescent.startPosition.set(targetPos.x, targetPos.y + introDescent.offsetY, targetPos.z);
        introDescent.endPosition.copy(targetPos);
      } else if (frameOnePreloader.active) {
        camera.position.copy(getFrameOnePosition());
        controls.target.copy(frameOneTarget);
        controls.update();
        animationCamera.startPosition.copy(camera.position);
        animationCamera.startTarget.copy(controls.target);
      }
    });

    /* --------------------------------------------------------------------- */
    /*  ANIMATE LOOP                                                          */
    /* --------------------------------------------------------------------- */

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      updateStartupSequence(dt);
      updateIntroDescent(dt);
      if (!startupSequence.active && cinematicSequence.phase === 'idle' && !frameOnePreloader.active && !introDescent.active) updateFlyMovement(dt);
      updateCinematicSequence(dt);
      updateLightSweep(dt);
      controls.update();

      modelEntries.forEach((entry) => { if (entry.mixer) entry.mixer.update(dt); });
      spotHelper.update();
      keyHelper.update();

      if (hudClock.running) {
        hudClock.elapsed += dt;
        if (hudTimecodeEl) hudTimecodeEl.textContent = formatTimecode(hudClock.elapsed);
      }

      keySettings.targetZ = parseFloat(keyLight.target.position.z.toFixed(2));
      spotSettings.posZ = parseFloat(spotLight.position.z.toFixed(2));

      // sync GUI display fields from live camera state
      camSettings.fov = parseFloat(camera.fov.toFixed(2));
      camSettings.posX = parseFloat(camera.position.x.toFixed(2));
      camSettings.posY = parseFloat(camera.position.y.toFixed(2));
      camSettings.posZ = parseFloat(camera.position.z.toFixed(2));
      camSettings.targetX = parseFloat(controls.target.x.toFixed(2));
      camSettings.targetY = parseFloat(controls.target.y.toFixed(2));
      camSettings.targetZ = parseFloat(controls.target.z.toFixed(2));

      composer.render();
    }

    animate();
  </script>
</body>

</html>
